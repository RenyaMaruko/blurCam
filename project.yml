name: blurCam
options:
  bundleIdPrefix: com.renyamaruko.blurCam
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

packages:
  HaishinKit:
    url: https://github.com/shogo4405/HaishinKit.swift
    version: 1.9.9

targets:
  blurCam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: blurCam
        excludes:
          - "**/.DS_Store"
    resources:
      - path: blurCam/Resources/Assets.xcassets
      - path: blurCam/Resources/ArcFace.mlpackage
      - path: blurCam/Resources/FaceNet.mlpackage
      - path: blurCam/Resources/Info.plist
        buildPhase: none
    dependencies:
      - package: HaishinKit
        product: HaishinKit
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        INFOPLIST_FILE: blurCam/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.renyamaruko.blurCam.app
        PRODUCT_NAME: blurCam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic

  blurCamTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: blurCamTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: blurCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.renyamaruko.blurCam.tests
        PRODUCT_NAME: blurCamTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/blurCam.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/blurCam"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic

schemes:
  blurCam:
    build:
      targets:
        blurCam: all
        blurCamTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - blurCamTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
